site_name: Pāṇini's Grammatik (Böhtlingk 1887)
site_url: https://birchville-org.github.io/boethlingk/
site_author: Marco Demarmels
site_description: Wissenschaftliche Digitalisierung, kanonisches Alignment, TEI-P5-Edition und 1:1 Sandwich-PDF (Otto von Böhtlingk, 1887).
repo_url: https://github.com/birchville-org/boethlingk
repo_name: birchville-org/boethlingk

theme:
  name: material
  language: de
  logo: assets/birchville_logo.png
  favicon: assets/birchville_logo.png
  palette:
    scheme: default
    primary: custom
    accent: custom
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/birchville.css

plugins:
  - search
  - i18n:
      docs_structure: folder
      languages:
        - locale: de
          name: Deutsch
          build: true
          default: true
        - locale: en
          name: English
          build: true

nav:
  - Startseite: index.md
  - Fallstudie: case-study.md
  - QA- & Korrektur-Workflow: qa-workflow.md
  - Urheberrecht & Provenienz: copyright-and-provenance.md
  - Datenarchitektur: data-architecture.md
  - Konventionen: conventions.md
  - Wiki-Übersicht: wiki-home.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - tables
  - attr_list
